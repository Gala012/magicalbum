name: magic_album
description: 'A new Flutter project.'
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.2
  flutter_screenutil: ^5.9.3
  styled_widget: ^0.4.1
  fluttertoast: ^8.2.5
  sqflite: ^2.4.2
  path: ^1.9.1
  intl: ^0.20.2
  flutter_inappwebview: ^6.1.5
  photo_manager: ^3.5.0
  package_info_plus: ^8.0.0
  flutter_timezone: ^3.0.0
  photo_manager_image_provider: ^2.1.1
  permission_handler: ^11.0.1
  uuid: ^4.5.1
  dio: ^5.4.3+1
  audioplayers: ^6.0.0
  share_plus: ^10.0.0
  device_info_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0


  # flutter pub run flutter_launcher_icons:main
flutter_launcher_icons:
  image_path: "assets/logo.png"
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/music/
    - assets/music/calm/
    - assets/music/electronic/
    - assets/music/epic/
    - assets/music/folk/
    - assets/music/happy/
    - assets/music/romantic/
    - assets/templates/
    - assets/templates/3d/
    - assets/templates/baby/
    - assets/templates/classic/
    - assets/templates/elegant/
    - assets/templates/holiday/
    - assets/templates/memorial/
    - assets/templates/minimal/
    - assets/templates/romance/
    - assets/templates/travel/
    - assets/templates/trendy/
